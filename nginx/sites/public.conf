# Disguised public vhost (honeynet-facing). To an attacker this looks like an
# ordinary static/CDN host. It fronts the agent telemetry endpoints, which are
# rewritten to the center's internal /agent/* routes. See docs/DESIGN.md §6.2.
#
# Sprint 0: only the cover story is in place. The /assets/v3/* -> /agent/*
# proxy is wired up in Sprint 2 together with TLS (MASK-1) and the agent API.

server {
    listen 8088;
    server_name _;

    # Cover story: a boring static landing, no honeypot/c2 markers anywhere.
    location = / {
        default_type text/html;
        return 200 "<!doctype html><title>CDN</title><h1>It works</h1>\n";
    }

    # --- Sprint 2 (disguised agent API) --------------------------------------
    # location /assets/v3/collect {       # -> POST /agent/telemetry
    #     proxy_pass http://center:8000/agent/telemetry;
    #     proxy_set_header X-Real-IP $remote_addr;
    # }
    # location /assets/v3/manifest.json { # -> GET  /agent/config
    #     proxy_pass http://center:8000/agent/config;
    # }
    # location /assets/v3/register {       # -> POST /agent/enroll
    #     proxy_pass http://center:8000/agent/enroll;
    # }
    # -------------------------------------------------------------------------

    # Everything else: plausible static 404, nothing that hints at a honeypot.
    location / {
        return 404 "Not Found\n";
    }
}
