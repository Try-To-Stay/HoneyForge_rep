# Disguised public vhost (honeynet-facing). To an attacker this looks like an
# ordinary static/CDN host over TLS. It fronts the agent telemetry endpoints,
# rewriting the disguised /assets/v3/* paths to the center's /agent/* routes.
# Telemetry is encrypted (MASK-1) and the paths carry no honeypot/c2 markers
# (MASK-2). See docs/DESIGN.md §6.2.

server {
    listen 8443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Cover story: a boring static landing.
    location = / {
        default_type text/html;
        return 200 "<!doctype html><title>CDN</title><h1>It works</h1>\n";
    }

    # Disguised agent API -> internal center routes.
    location = /assets/v3/register {
        proxy_pass http://center:8000/agent/enroll;
        proxy_set_header Host            $host;
        proxy_set_header X-Real-IP       $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location = /assets/v3/manifest.json {
        proxy_pass http://center:8000/agent/config;
        proxy_set_header Host            $host;
        proxy_set_header X-Real-IP       $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location = /assets/v3/collect {
        proxy_pass http://center:8000/agent/telemetry;
        proxy_set_header Host            $host;
        proxy_set_header X-Real-IP       $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Everything else: plausible static 404, nothing hinting at a honeypot.
    location / {
        return 404 "Not Found\n";
    }
}
