# Operator management vhost: dashboard SPA + Control API + realtime WS.
# Reachable only by the operator (published on MGMT_HTTP_PORT).
# TLS can be layered here later; Sprint 3 runs plain HTTP for local dev.

upstream center_mgmt { server center:8000; }
upstream dashboard_spa { server dashboard:80; }

server {
    listen 80;
    server_name _;

    # Realtime WebSocket stream (must come before /api/).
    location /api/v1/ws {
        proxy_pass http://center_mgmt;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
        proxy_read_timeout 3600s;
    }

    # Control API (operator surface).
    location /api/ {
        proxy_pass http://center_mgmt;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Swagger/OpenAPI passthrough (handy during development).
    location ~ ^/(docs|redoc|openapi.json)$ {
        proxy_pass http://center_mgmt;
        proxy_set_header Host $host;
    }

    location /healthz { proxy_pass http://center_mgmt; }

    # Dashboard SPA.
    location / {
        proxy_pass http://dashboard_spa;
        proxy_set_header Host $host;
    }
}
