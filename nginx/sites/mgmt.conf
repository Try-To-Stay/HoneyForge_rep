# Operator management vhost: dashboard + Control API.
# Reachable only by the operator (published on MGMT_HTTP_PORT).
# TLS is added in Sprint 2 (MASK-1); Sprint 0 runs plain HTTP for healthcheck.

upstream center_mgmt {
    server center:8000;
}

server {
    listen 80;
    server_name _;

    # Control API (operator surface). Full /api/v1/* lands here from Sprint 1.
    location /api/ {
        proxy_pass http://center_mgmt;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket realtime stream (added in Sprint 3).
    location /api/v1/ws {
        proxy_pass http://center_mgmt;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
        proxy_read_timeout 3600s;
    }

    # Ops probe (handy for `curl http://localhost:8080/healthz`).
    location /healthz {
        proxy_pass http://center_mgmt;
    }

    # Dashboard SPA is served here from Sprint 3. For now, proxy root to the API.
    location / {
        proxy_pass http://center_mgmt;
        proxy_set_header Host $host;
    }
}
