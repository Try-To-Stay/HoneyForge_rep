# Disguised public vhost — mTLS variant (MASK-7). Mounted over public.conf by
# docker-compose.mtls.yml.
#
# Key idea that preserves the CDN disguise (MASK-2): client-cert verification is
# OPTIONAL at the TLS layer, so the cover page and casual visitors work without
# a cert. A valid client cert is REQUIRED only on the agent paths — a passer-by
# never sees an mTLS challenge, only agents do.

server {
    listen 8443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Trust the HoneyForge CA for client certs, but don't force it globally.
    ssl_client_certificate /etc/nginx/certs/ca.crt;
    ssl_verify_client      optional;

    # Cover story: ordinary static landing, no cert needed.
    location = / {
        default_type text/html;
        return 200 "<!doctype html><title>CDN</title><h1>It works</h1>\n";
    }

    # Enrollment bootstraps without a client cert (gated by the enroll token).
    location = /assets/v3/register {
        proxy_pass http://center:8000/agent/enroll;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Agent data/config/rotate require a valid client cert (mTLS).
    location = /assets/v3/collect {
        if ($ssl_client_verify != SUCCESS) { return 403; }
        proxy_pass http://center:8000/agent/telemetry;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location = /assets/v3/manifest.json {
        if ($ssl_client_verify != SUCCESS) { return 403; }
        proxy_pass http://center:8000/agent/config;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location = /assets/v3/renew {
        if ($ssl_client_verify != SUCCESS) { return 403; }
        proxy_pass http://center:8000/agent/rotate;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location = /assets/v3/blob {
        if ($ssl_client_verify != SUCCESS) { return 403; }
        proxy_pass http://center:8000/agent/artifact;
        client_max_body_size 4m;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / { return 404 "Not Found\n"; }
}
