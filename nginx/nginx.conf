user  nginx;
worker_processes  auto;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile      on;
    keepalive_timeout  65;

    # Do not advertise nginx version (reduces fingerprinting surface).
    server_tokens off;

    # Operator (mgmt) vhost and the disguised public (honeynet) vhost.
    include /etc/nginx/conf.d/*.conf;
}
