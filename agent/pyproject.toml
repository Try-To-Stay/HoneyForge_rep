[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["honeyagent*"]

[project]
name = "honeyforge-agent"
version = "0.1.0"
description = "HoneyForge honeypot agent (config pull, beacons, buffered telemetry)"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27,<0.28",
]

[project.optional-dependencies]
dev = ["ruff>=0.7,<0.8"]

[tool.ruff]
line-length = 100
target-version = "py312"
