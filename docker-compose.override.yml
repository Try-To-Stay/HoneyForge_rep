# Dev overrides (auto-loaded by `docker compose`). NOT used in prod, where the
# stack is started explicitly with:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# This file adds local conveniences that are unsafe or unnecessary in prod:
# - center source bind-mount + hot reload, and the Docker socket so the
#   orchestrator (one-button deploy) works locally;
# - honeypot ports published to the host so you can attack them from localhost.
#
# High-interaction is a separate overlay — docker-compose.high.yml — so it can
# be enabled for either dev or prod (lab-only; see that file).

services:
  center:
    volumes:
      - ./center:/app
      - /var/run/docker.sock:/var/run/docker.sock   # orchestrator (lab-only)
    command: ["--reload"]

  honeypot-low:
    ports:
      - "2021:21"      # FTP banner
      - "2023:23"      # telnet banner
      - "23306:3306"   # MySQL banner

  honeypot-medium:
    ports:
      - "2222:22"      # fake-SSH
      - "8081:80"      # fake-HTTP admin
