# Production / VPS overlay — demo mode.
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# Deliberately does NOT load docker-compose.override.yml, so there is no Docker
# socket, no source bind-mount, and no honeypot ports published to the host.
# Honeypots listen only on the internal honeynet; the only thing reachable from
# outside is the operator dashboard on MGMT_HTTP_PORT (put it behind your TLS
# reverse proxy and/or firewall to trusted IPs).

services:
  postgres:
    restart: unless-stopped
  redis:
    restart: unless-stopped
  center:
    restart: unless-stopped
  dashboard:
    restart: unless-stopped
  nginx:
    restart: unless-stopped
  # Honeypot ports are published ONLY on 127.0.0.1 of the server — reachable
  # from the host and via SSH tunnel for the team to attack, but never exposed
  # to the internet. Remove these blocks to keep honeypots fully internal.
  honeypot-low:
    restart: unless-stopped
    ports:
      - "127.0.0.1:2021:21"
      - "127.0.0.1:2023:23"
      - "127.0.0.1:23306:3306"
  honeypot-medium:
    restart: unless-stopped
    ports:
      - "127.0.0.1:2222:22"
      - "127.0.0.1:18081:80"
