# HoneyForge — Sprint 0 stack: center + PostgreSQL + Redis + Nginx.
# Network segmentation (mgmt vs honeynet) and TLS are introduced in Sprint 2
# together with the agent and honeypots. See docs/DESIGN.md §4, §8.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [honeyforge]

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [honeyforge]

  center:
    build: ./center
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0) if urllib.request.urlopen('http://localhost:8000/healthz').status==200 else sys.exit(1)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    networks: [honeyforge]

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      center:
        condition: service_healthy
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/sites:/etc/nginx/conf.d:ro
    ports:
      - "${MGMT_HTTP_PORT:-8080}:80"      # operator mgmt (dashboard + API)
      - "${PUBLIC_HTTP_PORT:-8088}:8088"  # disguised public collector (honeynet)
    networks: [honeyforge]

volumes:
  pgdata:

networks:
  honeyforge:
    driver: bridge
