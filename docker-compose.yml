# HoneyForge stack.
#
# Network segmentation (MASK-3): postgres/redis/center live on the internal
# `mgmt` network with no route from the honeynet. Honeypot hosts live on
# `honeynet`. Only nginx straddles both, and the honeypot reaches the center
# solely through the disguised TLS endpoint on nginx. TLS (MASK-1) terminates
# at nginx:8443. Run scripts/gen-certs.sh once before the first `up`.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [mgmt]

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [mgmt]

  center:
    build: ./center
    env_file: .env
    # Lab-only: the Docker socket lets the center deploy honeypot containers
    # (Bonus FR-C6 orchestrator). Remove to disable one-button deploy.
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0) if urllib.request.urlopen('http://localhost:8000/healthz').status==200 else sys.exit(1)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    networks: [mgmt]

  # Generates the self-signed TLS cert into the shared `certs` volume if absent,
  # then exits — makes `docker compose up` fully self-contained.
  cert-init:
    build: ./center
    entrypoint: ["python", "scripts/gen_certs.py", "/certs"]
    volumes:
      - certs:/certs
    networks: [mgmt]

  dashboard:
    build: ./dashboard
    networks: [mgmt]

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      center:
        condition: service_healthy
      dashboard:
        condition: service_started
      cert-init:
        condition: service_completed_successfully
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/sites:/etc/nginx/conf.d:ro
      - certs:/etc/nginx/certs:ro
    ports:
      - "${MGMT_HTTP_PORT:-8080}:80"        # operator mgmt (dashboard + API)
      - "${PUBLIC_HTTPS_PORT:-8443}:8443"   # disguised TLS collector (honeynet)
    networks: [mgmt, honeynet]

  # Honeypot host: agent + Low honeypot in one image (DESIGN ADR-3).
  honeypot-low:
    build:
      context: .
      dockerfile: agent/Dockerfile
    depends_on:
      nginx:
        condition: service_started
    environment:
      HONEYFORGE_BASE_URL: https://nginx:8443
      HONEYFORGE_ENROLL_TOKEN: ${SEED_LOW_ENROLL_TOKEN}
      AGENT_TLS_VERIFY: "false"   # self-signed dev cert; mTLS/pinning is Bonus (MASK-7)
      AGENT_BEACON_INTERVAL_S: "10"
    volumes:
      - agentdata_low:/data
    ports:
      - "2021:21"      # attacker-facing honeypot ports (demo)
      - "2023:23"
      - "23306:3306"
    networks: [honeynet]

  # Second honeypot host: Medium (fake-SSH + fake-HTTP admin).
  honeypot-medium:
    build:
      context: .
      dockerfile: agent/Dockerfile
    depends_on:
      nginx:
        condition: service_started
    environment:
      HONEYFORGE_BASE_URL: https://nginx:8443
      HONEYFORGE_ENROLL_TOKEN: ${SEED_MEDIUM_ENROLL_TOKEN}
      AGENT_TLS_VERIFY: "false"
      AGENT_BEACON_INTERVAL_S: "10"
    volumes:
      - agentdata_medium:/data
    ports:
      - "2222:22"      # fake-SSH
      - "8081:80"      # fake-HTTP admin
    networks: [honeynet]

volumes:
  pgdata:
  agentdata_low:
  agentdata_medium:
  certs:

networks:
  mgmt:
    driver: bridge
    internal: true
  honeynet:
    driver: bridge
